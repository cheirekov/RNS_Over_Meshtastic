[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rns-over-meshtastic"
version = "0.4.0"
description = "Reticulum transport over Meshtastic LoRa and MQTT"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "RNS Over Meshtastic contributors" }]
dependencies = [
  "rns>=1.0,<2",
  "meshtastic>=2.7.11,<3",
  "paho-mqtt>=2.1,<3",
]

[project.optional-dependencies]
propagation = [
  "lxmf==1.1.1",
]
console = [
  "segno>=1.6,<2",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
rns-meshtastic = "rns_meshtastic.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rns_meshtastic"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
