services:
  mqtt:
    image: eclipse-mosquitto:2.0.22
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto-no-auth.conf:ro
    ports:
      - "127.0.0.1:18883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null"]
      interval: 5s
      timeout: 4s
      retries: 10

